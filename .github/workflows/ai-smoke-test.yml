name: AI extraction smoke test

# Manual only. Runs the extractor against ONE real rate PDF and prints the result
# to the job log. Uses the ANTHROPIC_API_KEY secret; writes nothing, publishes
# nothing, commits nothing -- a safe way to confirm the key authenticates and the
# confidence gate produces sane figures before enabling AI extraction for real.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the AI smoke test (one PDF, nothing written)
        env:
          INCENTIVES_AI_EXTRACT: "1"
          INCENTIVES_AI_MODEL: ${{ vars.INCENTIVES_AI_MODEL }}
          INCENTIVES_AI_SAMPLES: ${{ vars.INCENTIVES_AI_SAMPLES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_incentives.py --ai-smoke
