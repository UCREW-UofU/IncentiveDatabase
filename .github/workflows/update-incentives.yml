name: Update incentives & publish site

on:
  schedule:
    # Daily at 13:00 UTC (~6-7am Mountain). Cron is always UTC.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # Maintainer can run on demand from the Actions tab
  push:
    branches: [main]      # Rebuild on code changes too

permissions:
  contents: write   # commit the two-tier scan state back to the repo (audit trail)
  pages: write
  id-token: write

# Never let two publishes overlap; a newer run supersedes an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scanner (builds site/)
        # AI rate extraction stays OFF until you opt in: set repo variable
        # INCENTIVES_AI_EXTRACT=1 and add the ANTHROPIC_API_KEY secret. With
        # neither set, the extractor's available() returns False and the run is
        # byte-for-byte the same as before (see scrapers/extractor.py).
        env:
          INCENTIVES_AI_EXTRACT: ${{ vars.INCENTIVES_AI_EXTRACT }}
          INCENTIVES_AI_MODEL: ${{ vars.INCENTIVES_AI_MODEL }}
          INCENTIVES_AI_SAMPLES: ${{ vars.INCENTIVES_AI_SAMPLES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_incentives.py

      # Persist change-detection state + the needs-data worklist so new/changed
      # programs are remembered run-to-run and show up as a git-diff audit trail.
      # [skip ci] stops this bot commit from re-triggering the workflow.
      - name: Commit scan state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_state.json data/needs_data.md data/ai_extractions.json
          if git diff --cached --quiet; then
            echo "No scan-state changes to commit."
          else
            git commit -m "chore: update scan state [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Turn on Pages (GitHub Actions source) automatically

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
